<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0}.pv{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}.pv--col{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.pv--grid{display:grid;gap:16px}</style>
<link rel="stylesheet" href="../css/ds-tokens.css"><link rel="stylesheet" href="../css/ds.css"><meta name="robots" content="noindex, nofollow"></head>
<body>
<div class="ds-root" data-portal="staff">
<div class="pv" style="padding:8px 0;justify-content:center"><div class="ds-publishbar"><span class="ds-publishbar__live">Live</span><b>v1</b><span class="ds-publishbar__spacer"></span><button class="ds-btn ds-btn--outline ds-btn--xs" type="button">Discard changes</button><button class="ds-btn ds-btn--outline ds-btn--xs" type="button">Preview impact</button><button class="ds-btn ds-btn--success ds-btn--xs ds-btn--pill" type="button">Publish</button></div></div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function paint() {
    var aa = /-aa$/.test(root.getAttribute('data-theme') || '');
    document.querySelectorAll('[data-portal]').forEach(function (el) {
      el.setAttribute('data-theme', el.getAttribute('data-portal') + (aa ? '-aa' : ''));
    });
  }
  paint();
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.ds-seg__opt, .ds-tabs__tab');
    if (!opt) return;
    var group = opt.parentElement;
    var attr = opt.classList.contains('ds-tabs__tab') ? 'aria-selected' : 'aria-pressed';
    group.querySelectorAll('[' + attr + ']').forEach(function (b) { b.setAttribute(attr, 'false'); });
    opt.setAttribute(attr, 'true');
  });
})();
</script>
<script src="../js/bundle.js"></script><script>(function(){var aa=/[?&]aa=1/.test(location.search);document.documentElement.setAttribute("data-theme", aa ? "resident-aa" : "resident");if(window.HomeERP) HomeERP.paint();})();</script></body>
</html>
