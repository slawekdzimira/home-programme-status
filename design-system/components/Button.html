<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0}.pv{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}.pv--col{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.pv--grid{display:grid;gap:16px}</style>
<link rel="stylesheet" href="../css/ds-tokens.css"><link rel="stylesheet" href="../css/ds.css"><meta name="robots" content="noindex, nofollow"></head>
<body>
<div class="ds-root" data-portal="resident">
<div class="pv" style="padding:0">
<button class="ds-btn ds-btn--primary ds-btn--lg ds-btn--arrow" type="button">Start my application <svg class="ds-icon ds-icon--lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg></button>
<button class="ds-btn ds-btn--success ds-btn--arrow" type="button">Save &amp; continue <svg class="ds-icon ds-icon--lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg></button>
<button class="ds-btn ds-btn--danger" type="button">Remove this income source</button>
</div>
<div class="pv" style="padding:16px 0 0">
<button class="ds-btn ds-btn--dark" type="button" style="min-width:200px">Cancel</button>
<button class="ds-btn ds-btn--primary" type="button" style="min-width:200px">Save</button>
<button class="ds-btn ds-btn--outline ds-btn--xs" type="button">Browse file</button>
</div>
<div class="pv" style="padding:16px 0 0" data-portal="staff">
<button class="ds-btn ds-btn--accent ds-btn--sm ds-btn--pill" type="button">+ New case</button>
<button class="ds-btn ds-btn--primary ds-btn--xs" type="button">Open Qualification</button>
<button class="ds-btn ds-btn--outline ds-btn--xs" type="button">Re-evaluate</button>
<button class="ds-btn ds-btn--secondary ds-btn--xs" type="button"><svg class="ds-icon ds-icon--sm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9.25 13.25a.75.75 0 0 0 1.5 0V4.636l2.955 3.129a.75.75 0 0 0 1.09-1.03l-4.25-4.5a.75.75 0 0 0-1.09 0l-4.25 4.5a.75.75 0 1 0 1.09 1.03L9.25 4.636v8.614Z"/><path d="M3.5 12.75a.75.75 0 0 0-1.5 0v2.5A2.75 2.75 0 0 0 4.75 18h10.5A2.75 2.75 0 0 0 18 15.25v-2.5a.75.75 0 0 0-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5Z"/></svg> Upload document</button>
<button class="ds-btn ds-btn--danger ds-btn--sm ds-btn--pill" type="button"><svg class="ds-icon ds-icon--sm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/></svg> Resolve 2 blockers</button>
<button class="ds-btn ds-btn--success ds-btn--xs" type="button">Publish</button>
<button class="ds-btn ds-btn--dark ds-btn--xs" type="button">Approve with conditions</button>
<button class="ds-btn ds-btn--ghost ds-btn--xs" type="button">Escalate</button>
</div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function paint() {
    var aa = /-aa$/.test(root.getAttribute('data-theme') || '');
    document.querySelectorAll('[data-portal]').forEach(function (el) {
      el.setAttribute('data-theme', el.getAttribute('data-portal') + (aa ? '-aa' : ''));
    });
  }
  paint();
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.ds-seg__opt, .ds-tabs__tab');
    if (!opt) return;
    var group = opt.parentElement;
    var attr = opt.classList.contains('ds-tabs__tab') ? 'aria-selected' : 'aria-pressed';
    group.querySelectorAll('[' + attr + ']').forEach(function (b) { b.setAttribute(attr, 'false'); });
    opt.setAttribute(attr, 'true');
  });
})();
</script>
<script src="../js/bundle.js"></script><script>(function(){var aa=/[?&]aa=1/.test(location.search);document.documentElement.setAttribute("data-theme", aa ? "resident-aa" : "resident");if(window.HomeERP) HomeERP.paint();})();</script></body>
</html>
