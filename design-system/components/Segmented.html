<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0}.pv{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}.pv--col{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.pv--grid{display:grid;gap:16px}</style>
<link rel="stylesheet" href="../css/ds-tokens.css"><link rel="stylesheet" href="../css/ds.css"><meta name="robots" content="noindex, nofollow"></head>
<body>
<div class="ds-root" data-portal="resident">
<div class="pv pv--col" style="padding:0;gap:16px;max-width:520px">
<div class="ds-seg ds-seg--fill" role="group" aria-label="How many bedrooms?">
<button class="ds-seg__opt" type="button" aria-pressed="false">Any</button><button class="ds-seg__opt" type="button" aria-pressed="true">1</button><button class="ds-seg__opt" type="button" aria-pressed="false">2</button><button class="ds-seg__opt" type="button" aria-pressed="false">3</button><button class="ds-seg__opt" type="button" aria-pressed="false">4</button></div>
<div class="ds-seg ds-seg--fill" role="group" aria-label="When would you like to move in?">
<button class="ds-seg__opt" type="button" aria-pressed="true">As soon as possible</button><button class="ds-seg__opt" type="button" aria-pressed="false">In 1-3 months</button><button class="ds-seg__opt" type="button" aria-pressed="false">Pick a month</button></div>
<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
<div class="ds-seg ds-seg--yesno" role="group" aria-label="Does anyone get child support?"><button class="ds-seg__opt" type="button" aria-pressed="true">Yes</button><button class="ds-seg__opt" type="button" aria-pressed="false">No</button></div>
<div style="background:var(--brand-band-top);padding:12px;border-radius:var(--radius-xl)"><div class="ds-seg ds-seg--band" role="group" aria-label="Language"><button class="ds-seg__opt" type="button" aria-pressed="true">EN</button><button class="ds-seg__opt" type="button" aria-pressed="false">ES</button></div></div>
</div></div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function paint() {
    var aa = /-aa$/.test(root.getAttribute('data-theme') || '');
    document.querySelectorAll('[data-portal]').forEach(function (el) {
      el.setAttribute('data-theme', el.getAttribute('data-portal') + (aa ? '-aa' : ''));
    });
  }
  paint();
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.ds-seg__opt, .ds-tabs__tab');
    if (!opt) return;
    var group = opt.parentElement;
    var attr = opt.classList.contains('ds-tabs__tab') ? 'aria-selected' : 'aria-pressed';
    group.querySelectorAll('[' + attr + ']').forEach(function (b) { b.setAttribute(attr, 'false'); });
    opt.setAttribute(attr, 'true');
  });
})();
</script>
<script src="../js/bundle.js"></script><script>(function(){var aa=/[?&]aa=1/.test(location.search);document.documentElement.setAttribute("data-theme", aa ? "resident-aa" : "resident");if(window.HomeERP) HomeERP.paint();})();</script></body>
</html>
