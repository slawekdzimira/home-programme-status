<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0}.pv{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}.pv--col{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.pv--grid{display:grid;gap:16px}</style>
<link rel="stylesheet" href="../css/ds-tokens.css"><link rel="stylesheet" href="../css/ds.css"><meta name="robots" content="noindex, nofollow"></head>
<body>
<div class="ds-root" data-portal="staff">
<div class="ds-stats">
<div class="ds-stat"><span class="ds-stat__value">v1</span><span class="ds-stat__label">Active Version</span><span class="ds-stat__sub">Published Jul 29, 2026</span></div>
<div class="ds-stat ds-stat--olive"><span class="ds-stat__value">5</span><span class="ds-stat__label">Case Types</span><span class="ds-stat__sub">Active configurations</span></div>
<div class="ds-stat ds-stat--blue"><span class="ds-stat__value">5</span><span class="ds-stat__label">Programs</span><span class="ds-stat__sub">Active programs</span></div>
<div class="ds-stat ds-stat--violet"><span class="ds-stat__value">16</span><span class="ds-stat__label">Active rules</span><span class="ds-stat__sub">Requirements + validation</span></div>
<div class="ds-stat ds-stat--green"><span class="ds-stat__value">8</span><span class="ds-stat__label">Templates</span><span class="ds-stat__sub">Communication templates</span></div>
<div class="ds-stat ds-stat--pink"><span class="ds-stat__value">2</span><span class="ds-stat__label">Recent changes</span><span class="ds-stat__sub">Audit log entries</span></div>
</div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function paint() {
    var aa = /-aa$/.test(root.getAttribute('data-theme') || '');
    document.querySelectorAll('[data-portal]').forEach(function (el) {
      el.setAttribute('data-theme', el.getAttribute('data-portal') + (aa ? '-aa' : ''));
    });
  }
  paint();
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.ds-seg__opt, .ds-tabs__tab');
    if (!opt) return;
    var group = opt.parentElement;
    var attr = opt.classList.contains('ds-tabs__tab') ? 'aria-selected' : 'aria-pressed';
    group.querySelectorAll('[' + attr + ']').forEach(function (b) { b.setAttribute(attr, 'false'); });
    opt.setAttribute(attr, 'true');
  });
})();
</script>
<script src="../js/bundle.js"></script><script>(function(){var aa=/[?&]aa=1/.test(location.search);document.documentElement.setAttribute("data-theme", aa ? "resident-aa" : "resident");if(window.HomeERP) HomeERP.paint();})();</script></body>
</html>
