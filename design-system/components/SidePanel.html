<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0}.pv{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}.pv--col{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.pv--grid{display:grid;gap:16px}</style>
<link rel="stylesheet" href="../css/ds-tokens.css"><link rel="stylesheet" href="../css/ds.css"><meta name="robots" content="noindex, nofollow"></head>
<body>
<div class="ds-root" data-portal="staff">
<div style="display:grid;gap:16px;max-width:340px">
<section class="ds-side-panel"><div class="ds-side-panel__head">TIC FIELD COVERAGE</div><div class="ds-side-panel__body">
<p style="margin:0"><b>TIC header:</b> Building Identification Number (BIN) not set on unit or its linked building</p>
<p style="margin:0"><b>TIC Part VIII:</b> demographics incomplete for the head of household</p>
<span class="ds-tag ds-tag--neutral ds-tag--lg" style="justify-self:start">3 gaps · non-blocking</span>
<button class="ds-btn ds-btn--accent ds-btn--sm ds-btn--pill" type="button" style="justify-self:start">Fill the gaps</button></div></section>
<section class="ds-side-panel"><div class="ds-side-panel__head">Decision</div><div class="ds-side-panel__body">
<p style="margin:0">One decision, recorded here, advances the stage and writes the audit trail.</p>
<textarea class="ds-input ds-input--area" aria-label="Decision notes" placeholder="Notes - recorded with the decision" style="min-height:90px"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="ds-btn ds-btn--success ds-btn--xs" type="button">Approve case</button><button class="ds-btn ds-btn--dark ds-btn--xs" type="button">Approve with conditions</button></div>
<button class="ds-btn ds-btn--primary ds-btn--xs ds-btn--block" type="button">Send for correction</button>
<div style="display:flex;justify-content:space-between"><button class="ds-btn ds-btn--ghost ds-btn--xs" type="button">Escalate</button><button class="ds-btn ds-btn--ghost ds-btn--xs" type="button">Hold</button><button class="ds-btn ds-btn--ghost ds-btn--xs" type="button">Defer to at-signing</button></div>
</div></section></div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function paint() {
    var aa = /-aa$/.test(root.getAttribute('data-theme') || '');
    document.querySelectorAll('[data-portal]').forEach(function (el) {
      el.setAttribute('data-theme', el.getAttribute('data-portal') + (aa ? '-aa' : ''));
    });
  }
  paint();
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.ds-seg__opt, .ds-tabs__tab');
    if (!opt) return;
    var group = opt.parentElement;
    var attr = opt.classList.contains('ds-tabs__tab') ? 'aria-selected' : 'aria-pressed';
    group.querySelectorAll('[' + attr + ']').forEach(function (b) { b.setAttribute(attr, 'false'); });
    opt.setAttribute(attr, 'true');
  });
})();
</script>
<script src="../js/bundle.js"></script><script>(function(){var aa=/[?&]aa=1/.test(location.search);document.documentElement.setAttribute("data-theme", aa ? "resident-aa" : "resident");if(window.HomeERP) HomeERP.paint();})();</script></body>
</html>
