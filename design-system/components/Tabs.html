<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0}.pv{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}.pv--col{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.pv--grid{display:grid;gap:16px}</style>
<link rel="stylesheet" href="../css/ds-tokens.css"><link rel="stylesheet" href="../css/ds.css"><meta name="robots" content="noindex, nofollow"></head>
<body>
<div class="ds-root" data-portal="staff">
<div class="pv pv--col" style="padding:0;gap:12px">
<div class="ds-tabs" role="tablist" aria-label="Case queues">
<button class="ds-tabs__tab" role="tab" aria-selected="true" type="button">Needs you <span class="ds-count">2</span></button>
<button class="ds-tabs__tab" role="tab" aria-selected="false" type="button">Waiting on applicant <span class="ds-count">5</span></button>
<button class="ds-tabs__tab" role="tab" aria-selected="false" type="button">Overdue <span class="ds-count">8</span></button>
<button class="ds-tabs__tab" role="tab" aria-selected="false" type="button">Everything open <span class="ds-count">12</span></button>
<span class="ds-tabs__spacer"></span>
<button class="ds-tabs__tab" role="tab" aria-selected="false" type="button">Reviews <span class="ds-count">2</span></button>
<a class="ds-tabs__tab ds-tabs__link" href="#esign">E-sign Approval</a>
</div>
<div class="ds-tabs" role="tablist" aria-label="Case sections">
<button class="ds-tabs__tab" role="tab" aria-selected="false" type="button">Overview</button><button class="ds-tabs__tab" role="tab" aria-selected="false" type="button">Resident</button><button class="ds-tabs__tab" role="tab" aria-selected="true" type="button">Documents <span class="ds-count">4</span></button><button class="ds-tabs__tab" role="tab" aria-selected="false" type="button">Timeline <span class="ds-count">8</span></button><button class="ds-tabs__tab" role="tab" aria-selected="false" type="button">Review</button><span class="ds-tabs__spacer"></span><a class="ds-tabs__tab ds-tabs__link" href="#qa">Pre-submit QA</a>
</div>
</div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function paint() {
    var aa = /-aa$/.test(root.getAttribute('data-theme') || '');
    document.querySelectorAll('[data-portal]').forEach(function (el) {
      el.setAttribute('data-theme', el.getAttribute('data-portal') + (aa ? '-aa' : ''));
    });
  }
  paint();
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.ds-seg__opt, .ds-tabs__tab');
    if (!opt) return;
    var group = opt.parentElement;
    var attr = opt.classList.contains('ds-tabs__tab') ? 'aria-selected' : 'aria-pressed';
    group.querySelectorAll('[' + attr + ']').forEach(function (b) { b.setAttribute(attr, 'false'); });
    opt.setAttribute(attr, 'true');
  });
})();
</script>
<script src="../js/bundle.js"></script><script>(function(){var aa=/[?&]aa=1/.test(location.search);document.documentElement.setAttribute("data-theme", aa ? "resident-aa" : "resident");if(window.HomeERP) HomeERP.paint();})();</script></body>
</html>
