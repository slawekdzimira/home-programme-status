﻿<title>Four Streams to Completion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#EEF2F5; --surface:#FFFFFF; --surface-2:#F5F8FA; --surface-3:#E8EEF2;
  --ink:#0F1820; --ink-2:#41525F; --ink-3:#6D7E8B;
  --rule:#D5DEE4; --rule-2:#E6ECF0;
  --good:#186B4C; --good-fill:#1E7D59; --warn:#8F5B0C; --warn-fill:#B0770F;
  --crit:#9C3527; --crit-fill:#B84433; --planned:#94A4B0; --plan-fill:#C3CFD8;
  --accent:#2A5C86; --today:#B8431D;
  --l-scope:#2A5C86; --l-8ai:#1E7D59; --l-interim:#7A5299; --l-pbra:#B0770F;
  --shadow:0 1px 2px rgba(15,24,32,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1116; --surface:#141C23; --surface-2:#1A242C; --surface-3:#212C35;
    --ink:#E6EDF2; --ink-2:#AEBECA; --ink-3:#8294A1;
    --rule:#28343D; --rule-2:#1F2932;
    --good:#4FBE8C; --good-fill:#3EA97A; --warn:#DFA451; --warn-fill:#C08B3C;
    --crit:#E97A6D; --crit-fill:#C25A4C; --planned:#5C6D7B; --plan-fill:#33414C;
    --accent:#6FA6D4; --today:#FF7C5A;
    --l-scope:#6FA6D4; --l-8ai:#4FBE8C; --l-interim:#B08ACC; --l-pbra:#DFA451;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1116; --surface:#141C23; --surface-2:#1A242C; --surface-3:#212C35;
  --ink:#E6EDF2; --ink-2:#AEBECA; --ink-3:#8294A1;
  --rule:#28343D; --rule-2:#1F2932;
  --good:#4FBE8C; --good-fill:#3EA97A; --warn:#DFA451; --warn-fill:#C08B3C;
  --crit:#E97A6D; --crit-fill:#C25A4C; --planned:#5C6D7B; --plan-fill:#33414C;
  --accent:#6FA6D4; --today:#FF7C5A;
  --l-scope:#6FA6D4; --l-8ai:#4FBE8C; --l-interim:#B08ACC; --l-pbra:#DFA451;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Public Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.55; font-weight:400;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Source Serif 4",Georgia,"Iowan Old Style",Palatino,serif; font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.008em}
h1{font-size:2.15rem; line-height:1.16}
h2{font-size:1.42rem; line-height:1.25}
h3{font-size:1.04rem}
h4{font-size:.92rem}
p{margin:0}
a{color:var(--accent); text-underline-offset:2px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.num{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.eyebrow{font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3); font-weight:600}

.wrap{max-width:1200px; margin:0 auto; padding:44px 26px 80px; display:flex; flex-direction:column; gap:44px}

/* ---------- header ---------- */
header{display:flex; flex-direction:column; gap:16px; border-bottom:2px solid var(--rule); padding-bottom:28px}
.sub{color:var(--ink-2); max-width:74ch}
.sub strong{color:var(--ink); font-weight:600}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:3px; overflow:hidden}
.stat{background:var(--surface); padding:15px 17px; display:flex; flex-direction:column; gap:2px}
.stat .l{font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.stat .k{font-size:1.5rem; font-weight:600; letter-spacing:-.02em; line-height:1.15}
.stat .n{font-size:.78rem; color:var(--ink-2)}

/* ---------- generic card ---------- */
section{display:flex; flex-direction:column; gap:16px}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.scroll{overflow-x:auto}
.note{font-size:.79rem; color:var(--ink-3); max-width:88ch}
.note strong{color:var(--ink-2)}

/* ---------- lane rail ---------- */
.lane{border-left:3px solid var(--lane); padding-left:0}
.lane > .lanehead{display:flex; flex-direction:column; gap:7px; padding:0 0 0 17px; border-left:0}
.lanetag{display:inline-flex; align-items:center; gap:8px; font-size:.7rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--lane)}
.lanetag .sq{width:9px; height:9px; background:var(--lane); border-radius:1px; flex:none}
.laneinner{padding-left:17px; display:flex; flex-direction:column; gap:16px}

/* ---------- program board ---------- */
.board{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:3px; overflow:hidden}
.bcard{background:var(--surface); padding:18px 19px; display:flex; flex-direction:column; gap:11px; border-top:3px solid var(--lane)}
.bcard .h{display:flex; flex-direction:column; gap:1px}
.bcard .nm{font-family:"Source Serif 4",Georgia,serif; font-size:1.06rem; font-weight:600}
.bcard .wh{font-size:.75rem; color:var(--ink-3)}
.bcard .big{font-size:1.85rem; font-weight:600; letter-spacing:-.025em; line-height:1}
.meter{height:7px; border-radius:1px; background:var(--surface-3); overflow:hidden; display:flex}
.meter i{display:block; height:100%}
.meter .done{background:var(--lane)}
.meter .part{background:var(--lane); opacity:.42}
.bcard .kv{display:flex; flex-direction:column; gap:5px; font-size:.79rem; color:var(--ink-2); margin-top:2px}
.bcard .kv div{display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid var(--rule-2); padding-bottom:4px}
.bcard .kv div:last-child{border-bottom:none; padding-bottom:0}
.bcard .kv span:last-child{color:var(--ink); font-weight:600}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:.845rem}
th,td{text-align:right; padding:9px 10px; border-bottom:1px solid var(--rule-2); vertical-align:baseline}
th:first-child,td:first-child{text-align:left; padding-left:18px}
th:last-child,td:last-child{text-align:left; padding-right:18px}
thead th{font-size:.665rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600; border-bottom:1px solid var(--rule); white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:600; border-top:1px solid var(--rule); border-bottom:none; background:var(--surface-2)}
td .nmx{font-weight:600}
td .mt{display:block; font-size:.72rem; color:var(--ink-3); font-weight:400; margin-top:1px}
.dim{color:var(--ink-3)}

.pill{display:inline-flex; align-items:center; gap:6px; font-size:.7rem; font-weight:600; padding:2px 9px; border-radius:2px; border:1px solid currentColor; white-space:nowrap}
.p-ok{color:var(--good)} .p-risk{color:var(--warn)} .p-crit{color:var(--crit)} .p-idle{color:var(--planned)}
.dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}

.bar{position:relative; height:9px; border-radius:1px; background:var(--surface-3); overflow:hidden; min-width:64px}
.bar i{position:absolute; left:0; top:0; height:100%; border-radius:1px}
.bar .b-ok{background:var(--good-fill)} .bar .b-risk{background:var(--warn-fill)} .bar .b-crit{background:var(--crit-fill)} .bar .b-idle{background:var(--plan-fill)}
.bar .ghost{opacity:.34}

/* ---------- timeline ---------- */
.gantt{min-width:940px; display:grid; grid-template-columns:214px 1fr}
.glab{padding:10px 14px 10px 18px; border-bottom:1px solid var(--rule-2); display:flex; flex-direction:column; justify-content:center; gap:1px}
.glab .t{font-size:.85rem; font-weight:600; line-height:1.25}
.glab .m{font-size:.71rem; color:var(--ink-3)}
.glab .grisk{margin-top:4px; font-size:.68rem; font-weight:600; color:var(--warn); border:1px solid currentColor; border-radius:2px; padding:1px 6px; align-self:flex-start; line-height:1.35}
.gtrack{position:relative; border-bottom:1px solid var(--rule-2); border-left:1px solid var(--rule); padding:12px 0;
  background-image:linear-gradient(to right,var(--rule-2) 1px,transparent 1px); background-size:calc(100%/8) 100%}
.gbars{position:relative; height:20px}
.gbase{position:absolute; top:4px; height:13px; border:1px dashed var(--planned); border-radius:2px; background:var(--surface-3)}
.gfill{position:absolute; top:4px; height:13px; border-radius:2px; background:var(--lane)}
.gfill.soft{opacity:.4}
.gfill.g-risk{background:var(--warn-fill)}
.gfill.g-crit{background:var(--crit-fill)}
.gopen{position:absolute; top:4px; height:13px; border-radius:2px; border:1px solid var(--warn);
  background:repeating-linear-gradient(45deg,var(--warn) 0 2px,transparent 2px 6px); opacity:.5}
.gprior{position:absolute; top:6px; height:9px; border-radius:0 2px 2px 0; background:var(--lane); opacity:.28;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 34px); mask-image:linear-gradient(to right,transparent 0,#000 34px)}
.gpriortag{position:absolute; top:1px; font-size:.68rem; color:var(--ink-3); white-space:nowrap; padding-left:6px}
.gtest{position:absolute; top:6px; height:9px; border-radius:2px; border:1px solid var(--accent);
  background:repeating-linear-gradient(135deg,var(--accent) 0 2px,transparent 2px 5px); opacity:.8}
.gtag{position:absolute; top:1px; font-size:.7rem; color:var(--ink-2); white-space:nowrap; padding-left:9px}
.gtoday{position:absolute; top:0; bottom:0; width:2px; background:var(--today); z-index:3}
.gmark{position:absolute; top:0; bottom:0; width:1px; background:var(--ink-3); opacity:.45; z-index:2}
.gaxis{display:grid; grid-template-columns:214px 1fr}
.gaxis .sp{border-bottom:1px solid var(--rule)}
.gaxis .ax{position:relative; height:32px; border-left:1px solid var(--rule); border-bottom:1px solid var(--rule)}
.gaxis .ax span{position:absolute; top:8px; font-size:.71rem; color:var(--ink-3); transform:translateX(-50%); white-space:nowrap}
.legend{display:flex; flex-wrap:wrap; gap:13px 20px; padding:13px 18px; border-top:1px solid var(--rule); font-size:.76rem; color:var(--ink-2)}
.legend i{display:inline-block; width:20px; height:9px; border-radius:2px; margin-right:7px; vertical-align:middle}

/* ---------- intake strip ---------- */
.intake{display:flex; flex-direction:column}
.instrip{position:relative; padding:26px 22px 12px; border-bottom:1px solid var(--rule)}
.inaxis{position:relative; height:126px; border-bottom:1px solid var(--rule)}
.inday{position:absolute; bottom:0; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:5px}
.instack{display:flex; flex-direction:column-reverse; gap:2px}
.inchip{width:22px; height:7px; border-radius:1px; background:var(--lane)}
.inchip.pend{background:var(--lane); opacity:.38}
.inday .d{font-size:.7rem; color:var(--ink-3); white-space:nowrap; padding-top:3px; border-top:1px solid var(--rule); width:100%; text-align:center}
.inday .c{font-size:.72rem; font-weight:700; color:var(--ink-2)}
.inlegend{display:flex; flex-wrap:wrap; gap:11px 20px; padding:11px 22px; font-size:.75rem; color:var(--ink-2); border-bottom:1px solid var(--rule)}
.inlegend i{display:inline-block; width:18px; height:7px; border-radius:1px; margin-right:7px; vertical-align:middle}
.inrow{display:grid; grid-template-columns:62px 1fr 108px 132px; gap:14px; padding:9px 22px; border-bottom:1px solid var(--rule-2); align-items:baseline; font-size:.845rem}
.inrow:last-child{border-bottom:none}
.inrow .dt{font-size:.72rem; font-weight:700; letter-spacing:.04em; color:var(--ink-3); white-space:nowrap}
.inrow .wt{color:var(--ink-2)}
.inrow .wt b{color:var(--ink); font-weight:600}
.inrow .rf{font-size:.72rem; color:var(--ink-3); white-space:nowrap}
.inrow .st{font-size:.72rem; text-align:right}
.inrow.new{background:var(--surface-2)}
@media (max-width:720px){
  .inrow{grid-template-columns:1fr; gap:3px}
  .inrow .st{text-align:left}
}

/* ---------- open points ---------- */
.opens{display:flex; flex-direction:column}
.open{display:grid; grid-template-columns:104px 1fr 132px; gap:14px; padding:11px 20px; border-bottom:1px solid var(--rule-2); align-items:baseline}
.open:last-child{border-bottom:none}
.open .w{font-size:.71rem; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--ink-3)}
.open .s{font-size:.86rem; color:var(--ink-2)}
.open .s b{color:var(--ink); font-weight:600}
.open .o{font-size:.75rem; color:var(--ink-3); text-align:right}

ul{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:9px; color:var(--ink-2); font-size:.89rem}
li strong{color:var(--ink); font-weight:600}

/* ---------- morning-review agenda ---------- */
.agenda{display:flex; flex-direction:column}
.agitem{display:grid; grid-template-columns:112px 1fr; gap:16px; padding:13px 20px; border-bottom:1px solid var(--rule-2); align-items:baseline}
.agitem:last-child{border-bottom:none}
.agtext{font-size:.89rem; color:var(--ink-2)}
.agtext strong{color:var(--ink); font-weight:600}
.agchip{display:inline-block; font-size:.66rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  padding:2px 8px; border-radius:2px; border:1px solid var(--rule); color:var(--ink-3); white-space:nowrap}
.agchip.dec{color:var(--crit); border-color:currentColor}
@media (max-width:720px){.agitem{grid-template-columns:1fr; gap:6px}}

footer{border-top:1px solid var(--rule); padding-top:18px; font-size:.76rem; color:var(--ink-3); display:flex; flex-direction:column; gap:7px; max-width:96ch}

@media (max-width:720px){
  .wrap{padding:30px 16px 60px; gap:34px}
  h1{font-size:1.7rem}
  .open{grid-template-columns:1fr; gap:3px}
  .open .o{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>

<script>
const DATA = {"as_of": "2026-09-01", "programme": "El Paso &middot; Kruko delivery &middot; first wave at 1 September 2026 &middot; other streams at 24 August", "title": "Three streams to completion", "standfirst": "Where each stream stands today, what is left in it, and when it releases. <strong>PBRA goes out today; the HCV first wave and the applicant portal release on Tuesday 8 September.</strong> Interim recertification has been in production since 20 August and is no longer tracked here.", "headline": [{"label": "Streams", "value": "3", "note": "portal, PBRA, HCV scopes"}, {"label": "Live in production", "value": "1 + 1", "note": "interim since 20 Aug &middot; PBRA releases today"}, {"label": "Weighted execution", "value": "61.5%", "note": "across 1,616 items in build"}, {"label": "Handed over", "value": "970 / 1,616", "note": "delivered or beyond, three streams"}, {"label": "Next dates", "value": "1 &middot; 8 Sep", "note": "PBRA today &middot; HCV and portal next Tuesday"}], "board_intro": "The three streams in this deck. One card each: weighted execution across everything the stream has been broken into, how much of it has been delivered, and the release it is working to. <strong>Interim recertification is no longer tracked here &mdash; it has been resident-facing in production since 20 August</strong>, and Report a Change with it.", "lanes": [{"key": "8ai", "name": "8AI applicant portal", "what": "HCV applicant portal &mdash; client change list", "big": "63.3%", "meter_done": 62.1, "meter_part": 1.2, "kv": [["Client rows delivered", "52 / 70"], ["Delivered", "187 / 301"], ["Sections", "13 of 13 built"], ["Release", "8 Sep 2026"]]}, {"key": "pbra", "name": "PBRA", "what": "Project-based rental assistance", "big": "50.2%", "meter_done": 47.3, "meter_part": 2.9, "kv": [["Delivered", "69 / 146"], ["Release", "today, 1 Sep"], ["P0 follow-on", "21 rows, to 23 Sep"], ["Coverage", "83.6% broken down"]]}, {"key": "scope", "name": "HCV scopes, first wave", "what": "the ten scopes promised in 30 days", "big": "62.5%", "meter_done": 61.1, "meter_part": 1.4, "kv": [["Delivered", "714 / 1169"], ["Vs plan", "7.6 days behind"], ["Release", "8 Sep 2026"], ["Mapped below", "3 scopes &middot; 228 reqs"]]}], "board_note": "<strong>Weighted execution</strong> counts every task and bug a stream has been broken into: Dev Completed, QA, Resolved, Production Ready, Closed and Done score 1.0, Active or In Progress 0.3, New 0. <strong>Delivered means the code is written and merged</strong> &mdash; Dev Completed onwards; whether a tester has picked it up is a queue question, and 374 first-wave items sit in that queue today. Nothing is marked Done on these projects before production testing, so a move from QA to Closed does not raise the percentage: only work leaving New or Active does, and newly created tickets lower it. Beside each figure the stream carries its item count, so the headline can be checked. <strong>The first wave is the 1 September pull; the other three streams are the 24 August one</strong>, and the programme totals combine the two.", "timeline_intro": "The dashed frame is each stream&rsquo;s build window. The solid fill inside it is weighted execution expressed as a share of that window &mdash; a bar that reaches today is a stream running level with its own plan. The hatch is the testing window where one is evidenced. Dates past the frame are written at the end of the row rather than drawn, because they are extrapolations of an observed rate, not commitments.", "timeline_ticks": [{"date": "2026-08-03", "label": "3 Aug"}, {"date": "2026-08-17", "label": "17 Aug"}, {"date": "2026-08-31", "label": "31 Aug"}, {"date": "2026-09-14", "label": "14 Sep"}, {"date": "2026-09-28", "label": "28 Sep"}, {"date": "2026-10-12", "label": "12 Oct"}, {"date": "2026-10-26", "label": "26 Oct"}, {"date": "2026-11-09", "label": "9 Nov"}], "timeline_rows": [{"lane": "8ai", "name": "8AI applicant portal", "meta": "in build since January &middot; the frame is the client&rsquo;s change list, 44 of 97 rows delivered", "start": "2026-08-19", "plan_end": "2026-09-08", "progress_pct": 47.7, "handed_pct": 45.4, "test_start": "2026-08-19", "test_end": "2026-09-01", "marks": ["2026-09-08"], "tag": "release moved to 8 Sep &middot; 52 of 70 client rows closed", "band": "risk", "open_hatch": "2026-08-25", "risk": "Task count still moving", "prior": "in build since January 2026"}, {"lane": "pbra", "name": "PBRA", "meta": "annual recert core live &middot; go-live stated 1 Sep", "start": "2026-08-03", "plan_end": "2026-09-01", "progress_pct": 46.6, "handed_pct": 46.7, "marks": ["2026-09-01"], "tag": "releases today &middot; 21 P0 rows follow, to 23 Sep", "risk": "Sizing still in progress"}, {"lane": "scope", "name": "HCV scopes, first wave", "meta": "day 28 of 31 &middot; ten scopes", "start": "2026-08-05", "plan_end": "2026-09-08", "progress_pct": 62.5, "handed_pct": 61.1, "marks": ["2026-09-08"], "tag": "release moved to 8 Sep &middot; S06 clears 4 Sep &middot; S14 25 Sep &middot; S01 6 Oct &middot; S08 and S12 never staffed"}], "timeline_note": "The three windows are not equivalent commitments. <strong>PBRA releases today</strong>, and the HCV first wave and the applicant portal both release on <strong>Tuesday 8 September</strong> &mdash; moved off the 5 September window date on purpose, so that PBRA can go out today and the other two get a calm test window rather than three releases in one week. The frames are the span in which work already broken down clears at each stream&rsquo;s own measured rate; where a stream carries work that cannot be dated, the row says so rather than drawing a bar for it.", "lane_sections": [{"key": "8ai", "tag": "Stream 1 &middot; 8AI", "heading": "8AI &mdash; the applicant portal, measured on the client&rsquo;s own list", "intro": "The applicant portal for the HCV programme in Home ERP: the front door an applicant registers on, works through and submits from. It is not PBRA and not annual recertification &mdash; those run in DMS and have their own streams below. <strong>All thirteen sections of the flow are built</strong> and the client walked the whole thing on 18 August. Measured on today&rsquo;s board: <strong>63.3% weighted execution, 187 of 301 items delivered, and 52 of the 70 client rows closed</strong>. The portal release moves to <strong>Tuesday 8 September</strong> so it is not tested in the same days as the PBRA release.", "columns": ["Section", "Progress", "Delivered", "In build", "Open", "First filed", "Forecast", "Read"], "rows": [{"band": "risk", "meta": "password rules, kept values, logo and layout", "cells": ["1. Account registration &amp; sign-in", {"bar": 64.3, "text": "64.3%"}, "9 / 14", 0, 5, "19 Aug", "8 Sep", {"pill": "In flight"}]}, {"band": "ok", "meta": "moved out of registration into the application itself", "cells": ["2. Eligibility pre-check", {"bar": 71.4, "text": "71.4%"}, "5 / 7", 0, 2, "19 Aug", "8 Sep", {"pill": "In flight"}]}, {"band": "ok", "meta": "illustrations, editable contact block, language switch", "cells": ["3. Applicant dashboard", {"bar": 71.4, "text": "71.4%"}, "10 / 14", 0, 4, "19 Aug", "8 Sep", {"pill": "Barely moved"}]}, {"band": "ok", "meta": "program selection, waiting-list entry, assistance contact", "cells": ["4. Application start &amp; program selection", {"bar": 91.2, "text": "91.2%"}, "7 / 8", 1, 0, "19 Aug", "8 Sep", {"pill": "In flight"}]}, {"band": "ok", "meta": "citizenship wording, field order, the SSN-loss bug", "cells": ["5. Step 1 &mdash; household members", {"bar": 84.2, "text": "84.2%"}, "16 / 19", 0, 3, "19 Aug", "8 Sep", {"pill": "Half delivered"}]}, {"band": "risk", "meta": "homeless option, contact-block styling", "cells": ["6. Step 2 &mdash; address &amp; secondary contact", {"bar": 53.8, "text": "53.8%"}, "7 / 13", 0, 6, "19 Aug", "29 Aug", {"pill": "Half delivered"}]}, {"band": "risk", "meta": "the client&rsquo;s income rows arrived last, on 21 Aug", "cells": ["7. Step 3 &mdash; income", {"bar": 50.0, "text": "50.0%"}, "8 / 16", 0, 8, "19 Aug", "13 Sep", {"pill": "Behind"}]}, {"band": "risk", "meta": "filed 21 Aug &middot; 4 of 7 on staging within three days", "cells": ["8. Step 4 &mdash; assets", {"bar": 62.5, "text": "62.5%"}, "5 / 8", 0, 3, "21 Aug", "26 Aug", {"pill": "Fast turnaround"}]}, {"band": "ok", "meta": "child-care attribution, annualisation, notes removal", "cells": ["9. Step 5 &mdash; expenses", {"bar": 70.6, "text": "70.6%"}, "11 / 16", 1, 4, "21 Aug", "28 Aug", {"pill": "In flight"}]}, {"band": "risk", "meta": "all four rows delivered on 21 Aug", "cells": ["10. Step 6 &mdash; special accommodations", {"bar": 46.7, "text": "46.7%"}, "7 / 15", 0, 8, "21 Aug", "complete", {"pill": "Complete"}]}, {"band": "risk", "meta": "asset income in the calculation, edit-from-review", "cells": ["11. Review, consent forms &amp; submission", {"bar": 52.6, "text": "52.6%"}, "10 / 19", 0, 9, "21 Aug", "25 Aug", {"pill": "Nearly complete"}]}, {"band": "crit", "meta": "the client left this section of the form empty", "cells": ["12. After submission", {"bar": 12.5, "text": "12.5%"}, "1 / 8", 0, 7, "&mdash;", "&mdash;", {"pill": "No client rows"}]}, {"band": "risk", "meta": "left empty on the form; raised on the call instead", "cells": ["13. General &amp; cross-cutting", {"bar": 48.1, "text": "48.1%"}, "13 / 27", 0, 14, "&mdash;", "&mdash;", {"pill": "No client rows"}]}, {"band": "ok", "meta": "back button, step indicator, page titles, brand assets", "cells": ["Client call, 21 August", {"bar": 80.0, "text": "80.0%"}, "17 / 22", 2, 3, "24 Aug", "&mdash;", {"pill": "Not started"}]}, {"band": "risk", "meta": "tasks that carry several client rows at once, plus QA follow-ups", "cells": ["Implementation tasks &amp; QA follow-ups", {"bar": 66.7, "text": "66.7%"}, "61 / 95", 8, 26, "19 Aug", "26 Aug", {"pill": "In flight"}]}], "foot": ["All client rows", "63.3%", "187 / 301", 12, 102, "19 Aug", "8 Sep", ""], "table_note": "<strong>The basis is the client&rsquo;s own document.</strong> Every row here is a numbered request from the 18 August feedback form or the 21 August call, carried onto the board under Feature #13375 with the client&rsquo;s own row number in the title, so the table maps back to the file line by line. Sections 12 and 13 hold no rows because the client left them empty on the form. The last group is the implementation tasks that each carry several rows at once, plus the QA defects raised on delivered rows &mdash; they belong to the list but have no single row number of their own. <strong>Delivered</strong> means the row reached QA or beyond, which on this pipeline means it is on staging for the client to look at. The stream is worked to <strong>1 September</strong>. The 47 rows still open are estimated at <strong>about two days of work</strong>, so the target is comfortable on effort &mdash; what puts it at risk is the count, not the size. The list has grown at every measurement, <strong>from 39 rows on 19 August to 97 today</strong>, and three sections forecast past the target on their own observed rates: eligibility pre-check 3 Sep, dashboard 8 Sep, income 13 Sep. Treat 1 September as the target and the number of rows as the variable.", "opens": [{"kind": "Intake", "text": "The list has grown at every measurement: <b>39 rows on 19 August, 97 today</b>. Batch 3 and the ten items from the 21 August call are 100% not started. Any date on this page assumes the list stops growing.", "owner": "HOME &amp; Kruko"}, {"kind": "Go-live", "text": "A production deployment exists &mdash; <b>v1.0.1-15 on 19 August</b> &mdash; but Bug #12584 &ldquo;TODO before real users start using ERP&rdquo; still has four open children, two of them security-tagged and unstarted. <b>Nothing on the board records a public opening date</b>, so the portal should not be described as open to applicants.", "owner": "Kruko"}, {"kind": "Quality", "text": "The automated regression suite is red: today&rsquo;s full run was <b>303 passed, 36 failed of 349</b>, and 17 of the last 27 runs failed outright. There is no green baseline under this rate of change.", "owner": "Kruko"}, {"kind": "Client input", "text": "Sections 12 (After submission) and 13 (General) were left empty on the form, so there is <b>no client verdict on either</b>. Two dependencies from the call are also unstarted: sign-off on the migrated El Paso data, and enabling the daily legacy sync.", "owner": "HOME"}, {"kind": "Numbering", "text": "The form labels two different rows <b>8.1</b>, so one asset row is parked under a compound key. Renumbering section 8 in the source document would make the mapping exact.", "owner": "HOME"}, {"kind": "Counting", "text": "Five portal defects filed on 13 August (#12796&ndash;#12800) sit under the HCV area path and carry no feedback tag, so they are outside this list entirely. Sections 6 and 9 are that many items light until they are re-filed.", "owner": "Kruko"}], "notes": ["<strong>What this table no longer counts.</strong> The previous cut measured the whole portal backlog &mdash; 266 delivery items across ten board roots, including the BASC migration and the ERP&ndash;DMS seam &mdash; and read 55.1%. Narrowing the basis to the client&rsquo;s own list gives 47.7% over 97 rows. Both are true; this one is the one the client can check line by line against their own document.", "22 staging releases ran between 28 July and 24 August &mdash; <span class=\"num\">v1.0.1</span> to <span class=\"num\">v1.0.1-22</span>, roughly one per working day &mdash; against exactly one production deployment. On this pipeline a stage deploy moves items to QA and a production deploy closes them, so <span class=\"num\">Closed</span> means shipped and <span class=\"num\">Production Ready</span> means stage-verified only."]}, {"key": "8ai", "tag": "Client question &middot; 24 August", "heading": "The portals we are replacing, and what we can actually reach", "intro": "The question was whether we have access to the current portal to use as a template or foundation, with an offer to send the raw code. Three different things are being asked at once, and they have three different answers. <strong>We already have the source code</strong> for every legacy portal &mdash; working clones that still fetch today, so no raw code needs to be sent. <strong>We already have the data</strong>: roughly 50,000 users and 30,000 applicants were migrated into Home ERP under a work item that is closed. <strong>What we do not have is the running screens.</strong> Both legacy hosts answer and then refuse our address with an HTTP 403. That is the one real gap, and it is the only thing we need from the client on this.", "columns": ["Portal", "Audience", "Source code", "Running UI", "Migrated data", "Status"], "rows": [{"band": "risk", "meta": "Next.js, 179 pages, 138 of them under the resident area", "cells": ["EPHOME applicant &amp; resident portal", "Applicant, resident", "Yes &mdash; live clone", "No &mdash; 403", "Yes", {"pill": "Replaced by 8AI"}]}, {"band": "risk", "meta": "two complete local copies, same source project", "cells": ["EPHOME landlord portal", "Landlord", "Yes &mdash; local copies", "No &mdash; 403", "Yes", {"pill": "Being replaced"}]}, {"band": "idle", "meta": "Blazor, 193 screens, ships inside the API solution", "cells": ["EPHOME admin portal", "Caseworker", "Yes &mdash; in the API solution", "Not probed", "Yes", {"pill": "Replaced by DMS"}]}, {"band": "idle", "meta": "reads Yardi and the legacy database; no user interface", "cells": ["BASC middleware", "Caseworker", "Yes &mdash; local source", "No UI", "Partial", {"pill": "Stays, as an integration"}]}, {"band": "idle", "meta": "phone and IVR paths, four projects", "cells": ["EPHOME phone application", "Applicant", "Yes &mdash; local source", "No UI", "Partial", {"pill": "Stays"}]}], "table_note": "<strong>Source code: yes, and confirmed live.</strong> The legacy repositories are cloned locally with working credentials, and a remote listing returned current branch lists on 24 August &mdash; 21 branches on the applicant portal, 32 on the API, 86 on the ERP repository. <strong>So the offer of raw code is appreciated but not needed.</strong> <strong>Running UI: no.</strong> The applicant and landlord hosts both answer and then return <span class=\"num\">403 Ip Forbidden</span> from our network &mdash; the sites are up, our address is not on their allow-list. <strong>Data: already migrated.</strong> The BASC applicant and landlord load into Home ERP is closed, which is a stronger answer than a database connection would be. The one caveat worth stating: a direct connection to the legacy database server timed out from here, so live queries against it are not currently possible either.", "opens": [{"kind": "The ask", "text": "<b>Add our engineers&rsquo; addresses to the allow-list on the two legacy hosts</b> &mdash; or give us an approved network path, or a recorded walkthrough of the live screens. We can read every line of the legacy code and cannot watch a single legacy screen run. This is what the RFTA divergence comparison the client asked for actually needs.", "owner": "HOME &amp; BFG"}, {"kind": "Direction", "text": "We would like the answer to &ldquo;should we copy the current look&rdquo; confirmed as <b>no</b>, with the client&rsquo;s own feedback list staying the way the design is steered. It is working: 48 of the 103 rows filed are purely presentation, and 31 of those are already delivered or in build.", "owner": "HOME"}, {"kind": "Evidence", "text": "The concern that the current portal &ldquo;does not present well&rdquo; is supported by its own code. <b>Ten legacy pages render &ldquo;Under Construction&rdquo;</b>, including the entire Help section &mdash; accessibility, non-discrimination, equal housing opportunity, privacy and terms &mdash; and the accessibility route is misspelled in the URL.", "owner": "&mdash;"}, {"kind": "Language", "text": "Legacy Spanish covers <b>30% of applicant-facing text</b>: 394 of 565 translation keys are missing. The new portal carries six locales. Copying the legacy front end would inherit that gap rather than close it.", "owner": "&mdash;"}, {"kind": "Cost", "text": "A re-skin is not a stylesheet swap. The new portal is 392 templates behind 197 route modules; the legacy one is a single-page application in a different framework. Matching its look means rebuilding it, and <b>it would undo 31 presentation changes the client has already asked for and received</b>.", "owner": "&mdash;"}], "notes": ["<strong>The honest read on &ldquo;build 1.0 the same as the current, with 8AI flavour&rdquo;.</strong> There is no 1.0 waiting to be started. All thirteen sections are built, the client walked them end to end on 18 August, and the portal went to production on the 19th. So this is not a shortcut from a standing start &mdash; it is a redesign of something that already works, and it points at a design the client has themselves described as presenting badly. What is genuinely worth mining from the legacy system is its <em>behaviour</em>: the rules, edge cases and screens that El Paso staff rely on and that no requirement document captures. That is what the divergence comparison is for, and it is why seeing the running screens matters more than seeing the code.", "The feedback list has grown again since this page was measured: the same query returned <span class=\"num\">97</span> rows on 24 August and <span class=\"num\">103</span> on the morning of the 25th. The figures in the portal section above are the 24 August reading."]}, {"key": "pbra", "tag": "Stream 2 &middot; PBRA", "heading": "PBRA &mdash; what is left, and what cannot yet be dated", "intro": "<strong>PBRA releases today.</strong> The annual recertification flow, the resident registration path and the Yardi 50059 exchange go out on 1 September; the board reads <strong>50.2% weighted execution with 69 of 146 items delivered</strong> and 83.6% of the requirement set broken into tasks. <strong>The release is not the end of the stream.</strong> The client&rsquo;s own P0 schedule adds <strong>21 rows in three phases due between 1 and 23 September</strong>: 9 in phase 1 (the 50059 field set and the annual-recertification packet), 7 single tickets in phase 2, 5 in phase 3. Of those, 18 have not started, 2 are waiting on a HOME clarification and 5 have no work item yet &mdash; so the figures above will move down before they move up, as that intake lands.", "columns": ["Section", "Progress", "Handed over", "In build", "Open", "Client reqs", "Forecast", "Read"], "rows": [{"band": "risk", "meta": "the resident-facing annual recertification journey", "cells": ["Annual recert application &amp; resident flow", {"bar": 62.3, "text": "62.3%"}, "36 / 58", 3, 20, 5, "30 Sep", {"pill": "Core live, tail open"}]}, {"band": "crit", "meta": "12 of the 20 forms built", "cells": ["PBRA document bundle &mdash; 20 forms", {"bar": 37.3, "text": "37.3%"}, "5 / 17", 3, 9, 9, "30 Sep", {"pill": "8 forms unbuilt"}]}, {"band": "crit", "meta": "reminder cadence and the PBRA letter set", "cells": ["Recert timing, reminders &amp; letters", {"bar": 11.1, "text": "11.1%"}, "1 / 10", 1, 9, 4, "30 Sep", {"pill": "Barely started"}]}, {"band": "crit", "meta": "what counts as proof, and how old it may be", "cells": ["Income &amp; asset evidence rules", {"bar": 37.5, "text": "37.5%"}, "4 / 11", 0, 7, 6, "30 Sep", {"pill": "In flight"}]}, {"band": "risk", "meta": "BASC reported 37 mandatory fields missing; 19 must be built", "cells": ["Yardi 50059 exchange &amp; field set", {"bar": 66.7, "text": "66.7%"}, "4 / 7", 2, 2, 25, "30 Sep", {"pill": "19 fields unticketed"}]}, {"band": "crit", "meta": "how long a document stays valid", "cells": ["Document-validity framework", {"bar": 0.0, "text": "0.0%"}, "0 / 2", 0, 2, 1, "30 Sep", {"pill": "Waiting on the rule"}]}, {"band": "crit", "meta": "every template still carries an empty Spanish filename", "cells": ["Spanish document set &amp; bilingual notices", {"bar": 0.0, "text": "0.0%"}, "0 / 1", 0, 1, "&mdash;", "not dated", {"pill": "No Spanish content exists"}]}, {"band": "risk", "meta": "Envolve and Winn residents into the portal, then into DMS", "cells": ["Registration, migration &amp; ERP handoff", {"bar": 68.8, "text": "68.8%"}, "11 / 19", 1, 7, 4, "30 Sep", {"pill": "On plan"}]}, {"band": "crit", "meta": "the Home ERP side of project-based leasing", "cells": ["Project-based leasing in Home ERP", {"bar": 38.4, "text": "38.4%"}, "8 / 21", 2, 11, 3, "30 Sep", {"pill": "No commit since 6 Jul"}]}], "foot": ["PBRA, all sections", "50.2%", "69 / 146", 12, 68, "&mdash;", "&mdash;", ""], "table_note": "<strong>Client reqs</strong> is how many of the 57 registered client requirements fall in that section. The forecast column carries the <strong>end-September target</strong> the stream is being worked to; sections that cannot be dated at all say so, and they say why in the rows underneath. <strong>Sizing is still in progress</strong> &mdash; the raised requirements are being estimated now, the 19 Yardi fields the client ruled must be collected in the platform are not sized yet, and until that work finishes any total put against this stream would be a guess rather than a plan. The DMS board supplies no schedule of its own: its three iterations carry empty start and finish dates, and every work item was created on or after the 6 August organisation migration, so board dates cannot support any claim about history.", "opens": [{"kind": "Requirements", "text": "<b>35 of the 57 registered requirements are unsized and carry no work item</b>, and six of the seven rated P0 are among them. Until they are sized there is no completion date for this stream &mdash; that is the single fact that governs every other date on this page.", "owner": "HOME"}, {"kind": "Go-live", "text": "The stated go-live of <b>1 September</b> is eight days away with 8 of the 20 bundle forms unbuilt, the letter set barely started and the document-validity rule still open. It comes from the 3 August mail and has not been restated since.", "owner": "HOME"}, {"kind": "Scope churn", "text": "The application form has now been replaced twice. A 13-page revision was adopted on 14 August; <b>a further replacement PDF arrived on 24 August</b> and re-opens the field mapping.", "owner": "HOME"}, {"kind": "Design", "text": "The accepted design has <b>no caseworker side at all</b> &mdash; unchanged since 25 May &mdash; yet 28 of the 57 registered requirements are caseworker items. They cannot be estimated against a design baseline that does not cover them.", "owner": "HOME"}, {"kind": "Yardi fields", "text": "BASC reported 37 mandatory 50059 fields missing. The client ruled on 20 August that <b>19 of them must be collected in the platform</b>; none of the 19 is on the board. The other 18 are copy-forward on the BASC side and need no build.", "owner": "BFG"}, {"kind": "Language", "text": "Every one of the ten PBRA review-and-sign templates still carries an empty Spanish filename, and the translations are a client deliverable, so the bilingual requirement cannot start.", "owner": "HOME"}, {"kind": "Waiting", "text": "Ten open items are waiting on a client answer, four of them tagged so on the board &mdash; the document-validity rule, the two hardest forms, and four further items whose wording is still to be supplied.", "owner": "HOME"}], "notes": ["Two document forms merged on 21 August sit <em>after</em> the current production tag and are therefore not live; one further item is marked dev-complete with no code behind it at all. Both are ours to correct.", "45 of the work-item ids cited in merged PBRA pull-request subjects are old four-digit numbers from the previous Azure DevOps organisation. There is no working credential for that organisation, so those references cannot be resolved back to a requirement."], "intake": {"heading": "What has been raised into PBRA since 3 August", "intro": "Every item on this page carries the tracker&rsquo;s own <strong>P0 &mdash; Process Halted</strong> priority: work the client has marked as blocking the programme. <strong>Twenty-three of them were raised in the twenty-two days to 25 August</strong>, and none of them existed when the stream was planned. The column heights are how many arrived that day. Nine landed on 25 August alone, seven of those being 50059 fields the platform does not collect.", "legend_signed": "Priority signed off by HOME", "legend_pending": "Raised, sign-off still outstanding", "rows": [{"date": "2026-08-03", "ref": "T-00245", "what": "<b>Interims and eligibility added to the 1 September go-live</b> alongside annuals &mdash; only the annual recertification was ever sized", "wi": "", "wi_url": "", "status": "Not started", "band": "risk", "signed_off": true, "fresh": false}, {"date": "2026-08-03", "ref": "T-00246", "what": "<b>PBRA families have to be imported</b> so they can register and sign in; 12% carry an e-mail address, so onboarding is staff-led", "wi": "", "wi_url": "", "status": "Not started", "band": "risk", "signed_off": true, "fresh": false}, {"date": "2026-08-11", "ref": "T-00241", "what": "<b>Document-validity framework</b> &mdash; four document classes and the date each one is anchored to", "wi": "DMS-12816", "wi_url": "https://dev.azure.com/blueflame-devops/DMS/_workitems/edit/12816", "status": "Awaiting HOME", "band": "crit", "signed_off": false, "fresh": false}, {"date": "2026-08-14", "ref": "T-00238", "what": "Six consecutive <b>checking statements</b> and the latest savings statement, where one was collected before", "wi": "DMS-12810", "wi_url": "https://dev.azure.com/blueflame-devops/DMS/_workitems/edit/12810", "status": "Not started", "band": "risk", "signed_off": false, "fresh": false}, {"date": "2026-08-14", "ref": "T-00249", "what": "A <b>prepaid card counts as an asset</b> and must be reported even where the household holds no bank account", "wi": "", "wi_url": "", "status": "Not started", "band": "risk", cells": ["<strong>S08</strong> Special programs", {"bar": 0.0, "text": "0.0%"}, {"delta": 0.0}, "0 / 0", {"delta": -27.0}, "0 / 35", "&mdash;", "not staffed", {"pill": "Capacity went to interim"}]}], "foot": ["First wave, all ten scopes", "62.5%", {"delta": 1.1}, "714 / 1169", {"delta": -7.6}, "563 / 751", "4 Jul", "&mdash;", ""], "table_note": "<strong>&Delta; 24 Aug is computed on today&rsquo;s weighting for both dates</strong>, so the column compares like with like. <strong>A negative delta here is usually decomposition, not regression</strong>: S03 went from 23 items in build to 132, S07 from 55 to 146 and S01 from 399 to 462 as requirements were broken into tasks, so the ratio fell against a denominator that nearly doubled while the delivered count rose in every one of them. <strong>Delivered now means Dev Completed and beyond</strong> &mdash; the code is written and merged; whether a tester has picked it up is a queue question, and 374 items are in that queue today. <strong>Vs plan</strong> converts weighted execution into days ahead (+) or behind (&minus;) of a straight-line 31-day burn at day 28. Counted through the Epic&rarr;Feature&rarr;Story&rarr;Task hierarchy rather than by area path, because developers&rsquo; tasks inherit the project root area.", "opens": [{"kind": "Start date", "text": "The thirty days began three days after they were planned to. We asked for the requirement files to be confirmed on <b>2 August</b>; the answer on <b>3 August</b> was &ldquo;I will probably need a couple of days to review the requirements &mdash; can you please schedule an interim overview for tomorrow instead? we need to push it to live asap&rdquo;. We flagged the consequence on <b>4 August</b>. Confirmed requirements arrived <b>5 August</b>, and that is the date every forecast above is measured from.", "owner": "HOME"}, {"kind": "Answer latency", "text": "Requirements kept crystallising while we built. Of <b>136 anchored requirement questions</b>, the median answer took <b>2 days</b> &mdash; but <b>20 waited a week or more</b>, and they sat on the scopes that needed them most: <b>S04 &mdash; 17 days</b> (ten questions asked 7 Aug, answered 24 Aug: whether the EIV report belongs to the family or the member, whether extraction runs when the family never responded, whether a mismatch is a hard flag or a warning), <b>S06 &mdash; 14 days</b> (asked 7 Aug, answered 21 Aug), <b>S01 &mdash; 7 and 8 days</b> on the lobby tablet rules, <b>S02 &mdash; 7 days</b> on the clean-tier rule, <b>S09 &mdash; 5 to 6 days</b> on eight rows. <b>Fifteen are open today</b>, five of them the SEMAP indicator rules asked on 30 August.", "owner": "HOME"}, {"kind": "No test account", "text": "<b>Fax is not implemented and is out of this wave.</b> We delivered the provider evaluation on <b>28 August</b> &mdash; WestFax recommended, two fallbacks, BAA and compliance assessed &mdash; and asked for a test account to start. None has been issued, so every notice path that would use fax is delivered on the other channels and the fax seam is left open.", "owner": "HOME"}, {"kind": "No licensed feed", "text": "<b>Third-party income (The Work Number / Equifax) is out of this wave.</b> Section 5 of Scope 4 needs a licensed feed and a registered account on HOME&rsquo;s side; we asked for the decision on <b>28 August</b> and have no answer. Scope 4 is delivered on EIV and document-based income, which is what its forecast of 13 September covers.", "owner": "HOME"}, {"kind": "HUD access", "text": "<b>Scope 3&rsquo;s date depends on a HUD account we do not have.</b> On 28 August: &ldquo;we are currently working on getting you an account through Wojo, not sure about the UAT&rdquo;. The TRG format cut-over date is also unowned and sits with Tony. The 50058 file itself is produced and validated today &mdash; what is untested is the transmission.", "owner": "HOME"}, {"kind": "Divided capacity", "text": "<b>39% of the engineering output in this window went to work outside the wave</b> &mdash; 300 of 772 pull requests, 291 of them in the DMS repository, which is interim recertification and PBRA. That was the agreed sequencing: the interim overview was pulled ahead of the requirement review on 3 August, and on <b>26 August</b>, &ldquo;please consider this my approval for all p0&rsquo;s related to PBRA that are pending my approval&hellip; I don&rsquo;t want to delay your priority&rdquo;. Both streams shipped. S08 and S12 are the two scopes that paid for it.", "owner": "HOME &amp; Kruko"}, {"kind": "Ad-hoc requests", "text": "Served inside the window, none of it in the thirty-day scope: a report of all PBRA families currently employed (<b>5 and 17 August</b>), UAT credentials and a rebuilt demo account for a screen recording (<b>6 August</b>), demo data assembled overnight for the Monday LA presentation (<b>28 August</b>), and a new employment-verification requirement modelled on the PBV flow (<b>28 August</b>), after Scope 4 had been costed.", "owner": "HOME"}, {"kind": "Production test", "text": "<b>374 items are built, merged and sitting in QA.</b> Nothing is marked Done here before production testing, so booking that window is what turns the work above from &ldquo;delivered&rdquo; into &ldquo;closed&rdquo; on day 30.", "owner": "HOME &amp; Kruko"}], "notes": ["<b>What is excluded from this wave, and why the dates above already assume it:</b> inbound and outbound fax (no test account), the live third-party income pull (no licensed feed or account), and HUD PIC transmission (account being arranged). Each is a single integration seam against work that is otherwise finished &mdash; not a rebuild.", "<b>S08 and S12 were never staffed.</b> Seventy-two requirements between them, one task in build. The squad that would have taken them ran PBRA and interim recertification instead, at the client&rsquo;s own priority call. Both are fully specified and can start the week a wave-1 squad frees up."]}, {"key": "scope", "tag": "Stream 4 &middot; mapped out farther", "heading": "The three scopes below the first wave", "intro": "The scopes discussed and mapped out beyond the thirty days. All three are catalogued to requirement level on the board and <strong>none has been broken into a single task</strong>, so there is no delivery rate to extrapolate and no date to quote. What each needs in order to start is given instead.", "columns": ["Scope", "Requirements", "Features", "Broken down", "Requirements answered", "Start depends on", "Read"], "rows": [{"band": "idle", "meta": "catalogued 15 Aug", "cells": ["<strong>S05</strong> Rent reasonableness", 90, 10, "0 tasks", "14 Aug &middot; disputed", "Document sign-off, then a squad released from wave 1", {"pill": "Nothing in build"}]}, {"band": "idle", "meta": "catalogued 3 Aug", "cells": ["<strong>S11</strong> Reasonable accommodations", 45, 10, "0 tasks", "5 Aug", "S12 move handling and the fax verification channel", {"pill": "Nothing in build"}]}, {"band": "idle", "meta": "catalogued 15 Aug", "cells": ["<strong>S13</strong> EIV &amp; overpayment", 93, 11, "0 tasks", "14 Aug &middot; disputed", "Document sign-off and the EIV feed, itself an excluded dependency", {"pill": "Nothing in build"}]}], "foot": ["All three", 228, 31, "0 tasks", "&mdash;", "", ""], "table_note": "<strong>Requirements answered</strong> is the date the client&rsquo;s business-requirement document was answered. Two of the three are marked <em>disputed</em> because the epics themselves still carry a doc-pending tag against that date &mdash; one of the two records is stale, and it should be reconciled before either date is used to plan. <strong>S11 is the oldest untouched scope in the programme</strong>: its requirements were answered earliest of the three, on 5 August, and it has been sitting the longest.", "opens": [{"kind": "Sequencing", "text": "None of the three can start while wave 1 holds the squads. The first realistic opening is <b>after 5 September</b>, and S08 and S12 from wave 1 are already queued in front of them.", "owner": "Kruko"}, {"kind": "Dependency", "text": "S13 rests on the EIV feed, which is <b>an explicitly excluded dependency</b> in the current wave. Its 93 requirements are the largest tier-2 catalogue and the most exposed to something outside our control.", "owner": "HOME &amp; BFG"}]}], "closing": {"heading": "For the morning review: what is holding delivery up", "points": [{"text": "<strong>Book the production test window.</strong> <b>326 wave-1 items</b> are built, merged and out of the team&rsquo;s hands &mdash; 181 on the lobby scope alone &mdash; and none of them can be called done until production testing runs. The portal&rsquo;s 44 delivered client rows are sitting on staging waiting for the same step. This is the single largest block of finished work in the programme, and booking the window is what turns it from in progress into delivered.", "owner": "HOME + Kruko", "decide": true}, {"text": "<strong>Open the legacy screens to us.</strong> We hold the legacy source and the migrated data, but both legacy hosts refuse our address, so nobody here has seen the current portal run. An allow-list entry, an approved network path or a recorded walkthrough unblocks the divergence comparison the client asked for.", "owner": "HOME + BFG", "decide": true}, {"text": "<strong>Confirm the 1 September PBRA go-live, or move it.</strong> It is eight days away with 8 of the 20 bundle forms unbuilt, the letter set barely started, and a replacement application PDF that arrived on 24 August re-opening the field mapping.", "owner": "HOME", "decide": true}, {"text": "<strong>Finish sizing the PBRA requirements.</strong> Estimation is in progress now; six of the seven rated P0 are among the 35 that still carry no work item. Until it lands, end of September is a target rather than a plan.", "owner": "Kruko", "decide": false}, {"text": "<strong>Settle the historical import rule.</strong> RentCafe report, or recalculate from the proofs. It has been open since 2 July and the import engine is already 70 commits deep &mdash; yet the work carries no row on the shared tracker at all, so it is invisible to both sides&rsquo; planning.", "owner": "HOME", "decide": true}, {"text": "<strong>Answer the open questions.</strong> Four S01 design questions since 19 August, three on HOTMA since 23 August, ten PBRA items awaiting a client answer, and two portal dependencies. Each converts into work within a day or two of being settled.", "owner": "HOME", "decide": false}, {"text": "<strong>Decide the capacity split for September.</strong> Portal intake is arriving faster than it clears; S08, S12 and the three scopes below the wave all need a squad that the first wave currently holds. Knowing which keeps priority lets us hold these dates or adjust them early, together.", "owner": "HOME + Kruko", "decide": true}], "intro": "Each line is one thing to close out, with the side that has to move it. The ones marked <strong>decision</strong> cannot be worked around by effort &mdash; they need an answer before the work behind them can start. Of the 9, <strong>4 need an answer from HOME, 3 are shared, and 2 are ours</strong> &mdash; and the ones on the client&rsquo;s side account for most of what is not moving on this page."}, "footer": ["Sources, all read on 24 August 2026: Azure DevOps boards <span class=\"num\">blueflame-devops / ERP</span> and <span class=\"num\">blueflame-devops / DMS</span>, walked through the Epic&rarr;Feature&rarr;Story&rarr;Task hierarchy rather than by area path; completed pull requests and commits across eleven repositories; the build and deployment pipeline record, including tag builds and the production parameter; the semap-engine and hotma-engine rule sets; the client&rsquo;s feedback form and the PBRA requirement register.", "Release facts come from the pipeline record only, never from work-item states &mdash; a state of Production Ready on these boards is set by hand by QA and means stage-verified, not shipped. Forecast dates clear each stream&rsquo;s remaining broken-down backlog at that stream&rsquo;s own observed rate and assume no further intake; where a stream carries work that has not been broken down or sized, the row says &ldquo;not dated&rdquo; rather than showing an extrapolation.", "Two limits worth stating plainly. Every DMS work item was created on or after the 6 August organisation migration, so board dates there cannot support a claim about history and the git record is used instead. And the previous Azure DevOps organisation has no working credential, so 45 work-item references cited in merged PBRA pull requests cannot currently be resolved."]};

/* Render logic for the four-stream status deck.
   Appended to deck_template.html by build_deck.py, after DATA is injected. */

const $ = (t, cls, html) => {
  const e = document.createElement(t);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
};
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const d2 = s => {
  if (!s) return '—';
  const [y, m, d] = s.split('-').map(Number);
  return `${d} ${MON[m - 1]}`;
};
const pctTxt = v => (v == null ? '—' : v.toFixed(1) + '%');
const signed = v => (v == null ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1));
const bandCls = b => ({ ok: 'ok', risk: 'risk', crit: 'crit' }[b] || 'idle');
const pillCls = b => ({ ok: 'p-ok', risk: 'p-risk', crit: 'p-crit' }[b] || 'p-idle');

const app = document.getElementById('app');

/* ---------------- date axis helpers ---------------- */
const DAY0 = Date.UTC(2026, 7, 3);             /* 3 Aug 2026 */
const SPAN = 105;                               /* days on the axis, to 16 Nov */
const colOf = s => {
  const [y, m, d] = s.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - DAY0) / 864e5);
};
const px = c => (c / SPAN * 100).toFixed(3) + '%';
const wd = (a, b) => ((b - a) / SPAN * 100).toFixed(3) + '%';
const TODAY = colOf(DATA.as_of);

/* ---------------- header ---------------- */
function header() {
  const h = $('header');
  h.appendChild($('p', 'eyebrow', DATA.programme));
  h.appendChild($('h1', null, DATA.title));
  h.appendChild($('p', 'sub', DATA.standfirst));
  const st = $('div', 'stats');
  DATA.headline.forEach(s => {
    const c = $('div', 'stat');
    c.appendChild($('span', 'l', s.label));
    c.appendChild($('span', 'k num', s.value));
    c.appendChild($('span', 'n', s.note));
    st.appendChild(c);
  });
  h.appendChild(st);
  app.appendChild(h);
}

/* ---------------- programme board ---------------- */
function board() {
  const s = $('section');
  s.appendChild($('h2', null, 'The four streams at a glance'));
  s.appendChild($('p', 'sub', DATA.board_intro));
  const b = $('div', 'board');
  DATA.lanes.forEach(l => {
    const c = $('div', 'bcard');
    c.style.setProperty('--lane', `var(--l-${l.key})`);
    const hd = $('div', 'h');
    hd.appendChild($('span', 'nm', l.name));
    hd.appendChild($('span', 'wh', l.what));
    c.appendChild(hd);
    c.appendChild($('span', 'big num', l.big));
    const m = $('div', 'meter');
    m.appendChild($('i', 'done', '')).style.width = (l.meter_done || 0) + '%';
    m.appendChild($('i', 'part', '')).style.width = (l.meter_part || 0) + '%';
    c.appendChild(m);
    const kv = $('div', 'kv');
    l.kv.forEach(([k, v]) => {
      const r = $('div');
      r.appendChild($('span', null, k));
      r.appendChild($('span', 'num', v));
      kv.appendChild(r);
    });
    c.appendChild(kv);
    b.appendChild(c);
  });
  s.appendChild(b);
  if (DATA.board_note) s.appendChild($('p', 'note', DATA.board_note));
  app.appendChild(s);
}

/* ---------------- shared timeline ---------------- */
function timeline() {
  const s = $('section');
  s.appendChild($('h2', null, 'One timeline, all four streams'));
  s.appendChild($('p', 'sub', DATA.timeline_intro));

  const card = $('div', 'card');
  const sc = $('div', 'scroll');

  const ax = $('div', 'gaxis');
  ax.appendChild($('div', 'sp'));
  const axi = $('div', 'ax');
  DATA.timeline_ticks.forEach(t => {
    const sp = $('span', null, t.label);
    sp.style.left = px(colOf(t.date));
    axi.appendChild(sp);
  });
  ax.appendChild(axi);
  sc.appendChild(ax);

  const g = $('div', 'gantt');
  DATA.timeline_rows.forEach(r => {
    const lab = $('div', 'glab');
    lab.style.setProperty('--lane', `var(--l-${r.lane})`);
    lab.appendChild($('span', 't', r.name));
    lab.appendChild($('span', 'm', r.meta));
    if (r.risk) lab.appendChild($('span', 'grisk', r.risk));
    const tr = $('div', 'gtrack');
    tr.style.setProperty('--lane', `var(--l-${r.lane})`);
    const bars = $('div', 'gbars');

    /* the dashed frame is the build window; the solid fill inside it is weighted
       execution expressed as a share of that window, so a bar that reaches today
       is a stream running level with its own plan. */
    const a = colOf(r.start), z = colOf(r.plan_end);
    let html = '';
    /* Work that predates the axis: a muted bar running off the left edge, so a stream
       that has been in build for months does not read as if it started this month. */
    if (r.prior) {
      html += `<div class="gprior" style="left:0;width:${wd(0, a)}"></div>` +
              `<div class="gpriortag" style="left:0">${r.prior}</div>`;
    }
    html += `<div class="gbase" style="left:${px(a)};width:${wd(a, z)}"></div>`;
    const bc = r.band ? ' g-' + r.band : '';
    const earned = a + (z - a) * (r.progress_pct || 0) / 100;
    const handed = a + (z - a) * (r.handed_pct != null ? r.handed_pct : r.progress_pct || 0) / 100;
    if (earned > a + 0.2) html += `<div class="gfill soft${bc}" style="left:${px(a)};width:${wd(a, earned)}"></div>`;
    if (handed > a + 0.2) html += `<div class="gfill${bc}" style="left:${px(a)};width:${wd(a, handed)}"></div>`;
    if (r.open_hatch) {
      const oh = colOf(r.open_hatch);
      if (z > oh) html += `<div class="gopen" style="left:${px(oh)};width:${wd(oh, z)}"></div>`;
    }
    if (r.test_start && r.test_end) {
      const ts = colOf(r.test_start), te = colOf(r.test_end);
      html += `<div class="gtest" style="left:${px(ts)};width:${wd(ts, te)}"></div>`;
    }
    const tagAt = Math.max(z, r.test_end ? colOf(r.test_end) : z);
    html += `<div class="gtag" style="left:${px(tagAt)}">${r.tag}</div>`;
    (r.marks || []).forEach(m => {
      html += `<div class="gmark" style="left:${px(colOf(m))}"></div>`;
    });
    html += `<div class="gtoday" style="left:${px(TODAY)}"></div>`;
    bars.innerHTML = html;
    tr.appendChild(bars);
    g.append(lab, tr);
  });
  sc.appendChild(g);
  card.appendChild(sc);

  const lg = $('div', 'legend');
  lg.innerHTML =
    `<span><i style="background:var(--surface-3); border:1px dashed var(--planned)"></i>Planned window</span>` +
    `<span><i style="background:var(--l-scope)"></i>Handed over &mdash; QA or beyond</span>` +
    `<span><i style="background:var(--l-scope); opacity:.4"></i>Built, still in development</span>` +
    `<span><i style="border:1px solid var(--accent); background:repeating-linear-gradient(135deg,var(--accent) 0 2px,transparent 2px 5px)"></i>Testing window</span>` +
    `<span><i style="width:2px; background:var(--today)"></i>Today, ${d2(DATA.as_of)}</span>` +
    `<span><i style="width:1px; background:var(--ink-3)"></i>Key date on that stream</span>`;
  card.appendChild(lg);
  s.appendChild(card);
  if (DATA.timeline_note) s.appendChild($('p', 'note', DATA.timeline_note));
  app.appendChild(s);
}

/* ---------------- intake chronology ----------------
   A stream's own arrival record: one column per day something was raised into it,
   the column height being how many items arrived that day, and underneath the
   itemised list. The scale is local to the block, not the shared programme axis,
   because intake spans weeks rather than months. */
function intakeBlock(l) {
  const k = l.intake;
  const days = [...new Set(k.rows.map(r => r.date))].sort();
  const t0 = Date.parse(days[0]), t1 = Date.parse(days[days.length - 1]);
  const span = Math.max(1, (t1 - t0) / 864e5);
  const at = s => (4 + (Date.parse(s) - t0) / 864e5 / span * 92).toFixed(3) + '%';

  const wrap = $('div');
  wrap.appendChild($('h3', null, k.heading));
  if (k.intro) wrap.appendChild($('p', 'sub', k.intro));

  const card = $('div', 'card intake');
  card.style.setProperty('--lane', `var(--l-${l.key})`);

  const strip = $('div', 'instrip');
  const ax = $('div', 'inaxis');
  days.forEach(d => {
    const items = k.rows.filter(r => r.date === d);
    const col = $('div', 'inday');
    col.style.left = at(d);
    const stack = $('div', 'instack');
    items.forEach(r => stack.appendChild($('i', r.signed_off ? 'inchip' : 'inchip pend')));
    col.appendChild($('span', 'c num', String(items.length)));
    col.appendChild(stack);
    col.appendChild($('span', 'd', d2(d)));
    ax.appendChild(col);
  });
  strip.appendChild(ax);
  card.appendChild(strip);

  const lg = $('div', 'inlegend');
  lg.innerHTML =
    `<span><i style="background:var(--l-${l.key})"></i>${k.legend_signed}</span>` +
    `<span><i style="background:var(--l-${l.key}); opacity:.38"></i>${k.legend_pending}</span>`;
  card.appendChild(lg);

  k.rows.forEach(r => {
    const row = $('div', 'inrow' + (r.fresh ? ' new' : ''));
    const ref = r.wi
      ? `${r.ref} &middot; <a href="${r.wi_url}">${r.wi}</a>`
      : `${r.ref} &middot; <span class="dim">no work item</span>`;
    row.innerHTML =
      `<span class="dt">${d2(r.date)}</span>` +
      `<span class="wt">${r.what}</span>` +
      `<span class="rf">${ref}</span>` +
      `<span class="st"><span class="pill ${pillCls(r.band)}"><span class="dot"></span>${r.status}</span></span>`;
    card.appendChild(row);
  });

  wrap.appendChild(card);
  if (k.note) wrap.appendChild($('p', 'note', k.note));
  return wrap;
}

/* ---------------- one lane ---------------- */
function laneSection(l) {
  const s = $('section', 'lane');
  s.style.setProperty('--lane', `var(--l-${l.key})`);

  const head = $('div', 'lanehead');
  head.innerHTML = `<span class="lanetag"><span class="sq"></span>${l.tag}</span>`;
  head.appendChild($('h2', null, l.heading));
  head.appendChild($('p', 'sub', l.intro));
  s.appendChild(head);

  const inner = $('div', 'laneinner');

  /* the register table */
  const card = $('div', 'card scroll');
  const t = $('table');
  const cols = l.columns;
  t.innerHTML = `<thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>`;
  const tb = $('tbody');
  l.rows.forEach(r => {
    const tr = $('tr');
    const cells = r.cells.map((c, i) => {
      if (i === 0) return `<td><span class="nmx">${c}</span>${r.meta ? `<span class="mt">${r.meta}</span>` : ''}</td>`;
      if (c === null) return `<td class="num dim">—</td>`;
      if (typeof c === 'object' && c.bar != null) {
        const g = c.ghost != null ? `<i class="ghost b-${bandCls(r.band)}" style="width:${c.ghost}%"></i>` : '';
        return `<td class="num"><div style="display:flex; align-items:center; gap:9px; justify-content:flex-end">` +
          `<span>${c.text}</span><span class="bar">${g}<i class="b-${bandCls(r.band)}" style="width:${c.bar}%"></i></span></div></td>`;
      }
      if (typeof c === 'object' && c.pill != null) {
        return `<td><span class="pill ${pillCls(r.band)}"><span class="dot"></span>${c.pill}</span></td>`;
      }
      if (typeof c === 'object' && c.delta != null) {
        const col = c.delta > 0 ? 'var(--good)' : c.delta < 0 ? 'var(--warn)' : 'var(--ink-3)';
        return `<td class="num" style="color:${col}">${c.delta === 0 ? '—' : signed(c.delta)}</td>`;
      }
      return `<td class="num">${c}</td>`;
    });
    tr.innerHTML = cells.join('');
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  if (l.foot) {
    const tf = $('tfoot');
    tf.innerHTML = `<tr>${l.foot.map((c, i) => {
      if (i === 0) return `<td>${c}</td>`;
      if (c === null) return '<td class="num dim">&mdash;</td>';
      if (typeof c === 'object' && c.delta != null) {
        const col = c.delta > 0 ? 'var(--good)' : c.delta < 0 ? 'var(--warn)' : 'var(--ink-3)';
        return `<td class="num" style="color:${col}">${signed(c.delta)}</td>`;
      }
      return `<td class="num">${c}</td>`;
    }).join('')}</tr>`;
    t.appendChild(tf);
  }
  card.appendChild(t);
  inner.appendChild(card);
  if (l.table_note) inner.appendChild($('p', 'note', l.table_note));

  /* intake chronology: what was raised into the stream, and when */
  if (l.intake) inner.appendChild(intakeBlock(l));

  /* open points */
  if (l.opens && l.opens.length) {
    inner.appendChild($('h3', null, l.opens_heading || 'What is open, and on whose side'));
    const oc = $('div', 'card opens');
    l.opens.forEach(o => {
      const e = $('div', 'open');
      e.innerHTML = `<span class="w">${o.kind}</span><span class="s">${o.text}</span><span class="o">${o.owner}</span>`;
      oc.appendChild(e);
    });
    inner.appendChild(oc);
  }

  (l.notes || []).forEach(n => inner.appendChild($('p', 'note', n)));
  s.appendChild(inner);
  app.appendChild(s);
}

/* ---------------- closing ---------------- */
function closing() {
  const s = $('section');
  s.appendChild($('h2', null, DATA.closing.heading));
  if (DATA.closing.intro) s.appendChild($('p', 'sub', DATA.closing.intro));
  const c = $('div', 'card agenda');
  DATA.closing.points.forEach(p => {
    const text = typeof p === 'string' ? p : p.text;
    const row = $('div', 'agitem');
    const who = $('div', 'agwho');
    if (typeof p !== 'string' && p.owner) {
      who.innerHTML = `<span class="agchip ${p.decide ? 'dec' : ''}">${p.owner}</span>`;
    }
    row.appendChild(who);
    row.appendChild($('div', 'agtext', text));
    c.appendChild(row);
  });
  s.appendChild(c);
  app.appendChild(s);

  const f = $('footer');
  DATA.footer.forEach(p => f.appendChild($('p', null, p)));
  app.appendChild(f);
}

header();
board();
timeline();
DATA.lane_sections.forEach(laneSection);
closing();

</script>


</body>
