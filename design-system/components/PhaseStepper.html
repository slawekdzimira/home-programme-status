<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0}.pv{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}.pv--col{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.pv--grid{display:grid;gap:16px}</style>
<link rel="stylesheet" href="../css/ds-tokens.css"><link rel="stylesheet" href="../css/ds.css"><meta name="robots" content="noindex, nofollow"></head>
<body>
<div class="ds-root" data-portal="resident">
<div class="ds-card" style="display:flex;align-items:center;gap:32px;flex-wrap:wrap;padding:20px 36px;border:1px solid var(--border)">
<span style="font:600 20px/28px var(--font-sans)">Your application</span>
<span class="ds-steps"><span class="ds-steps__current"><span class="ds-steps__disc">I</span>Household</span><svg class="ds-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
<span class="ds-steps__rest"><span class="ds-steps__disc">II</span><span class="ds-steps__disc">III</span><span class="ds-steps__disc">IV</span><span class="ds-steps__disc">V</span><span class="ds-steps__disc">VI</span><span class="ds-steps__disc">VII</span><span class="ds-steps__disc">VIII</span></span></span>
<span class="ds-progress" style="margin-left:auto"><span class="ds-progress__track"><span class="ds-progress__fill" style="width:25%"></span></span>25%</span>
</div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function paint() {
    var aa = /-aa$/.test(root.getAttribute('data-theme') || '');
    document.querySelectorAll('[data-portal]').forEach(function (el) {
      el.setAttribute('data-theme', el.getAttribute('data-portal') + (aa ? '-aa' : ''));
    });
  }
  paint();
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.ds-seg__opt, .ds-tabs__tab');
    if (!opt) return;
    var group = opt.parentElement;
    var attr = opt.classList.contains('ds-tabs__tab') ? 'aria-selected' : 'aria-pressed';
    group.querySelectorAll('[' + attr + ']').forEach(function (b) { b.setAttribute(attr, 'false'); });
    opt.setAttribute(attr, 'true');
  });
})();
</script>
<script src="../js/bundle.js"></script><script>(function(){var aa=/[?&]aa=1/.test(location.search);document.documentElement.setAttribute("data-theme", aa ? "resident-aa" : "resident");if(window.HomeERP) HomeERP.paint();})();</script></body>
</html>
