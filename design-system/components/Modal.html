<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0}.pv{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}.pv--col{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.pv--grid{display:grid;gap:16px}</style>
<link rel="stylesheet" href="../css/ds-tokens.css"><link rel="stylesheet" href="../css/ds.css"><meta name="robots" content="noindex, nofollow"></head>
<body>
<div class="ds-root" data-portal="resident">
<div style="position:relative;background:var(--surface-page);padding:24px;border-radius:var(--radius-xl)">
<div class="ds-modal" role="dialog" aria-modal="true" aria-labelledby="mt" style="margin:0 auto;width:min(640px,100%)">
<div class="ds-modal__head"><h2 class="ds-modal__title" id="mt">I don't have <b>Social Security Cards</b></h2><button class="ds-icon-btn" type="button" aria-label="Close" style="background:transparent;color:var(--on-brand)"><svg class="ds-icon ds-icon--lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg></button></div>
<div class="ds-modal__body"><label class="ds-field__label" for="why">Tell us why you can't provide this, and we'll try to help:</label><textarea class="ds-input ds-input--area" id="why" placeholder="Type text"></textarea></div>
<div class="ds-modal__actions" style="justify-content:stretch"><button class="ds-btn ds-btn--dark" type="button" style="flex:1">Cancel</button><button class="ds-btn ds-btn--primary" type="button" style="flex:1">Save</button></div>
</div></div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function paint() {
    var aa = /-aa$/.test(root.getAttribute('data-theme') || '');
    document.querySelectorAll('[data-portal]').forEach(function (el) {
      el.setAttribute('data-theme', el.getAttribute('data-portal') + (aa ? '-aa' : ''));
    });
  }
  paint();
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.ds-seg__opt, .ds-tabs__tab');
    if (!opt) return;
    var group = opt.parentElement;
    var attr = opt.classList.contains('ds-tabs__tab') ? 'aria-selected' : 'aria-pressed';
    group.querySelectorAll('[' + attr + ']').forEach(function (b) { b.setAttribute(attr, 'false'); });
    opt.setAttribute(attr, 'true');
  });
})();
</script>
<script src="../js/bundle.js"></script><script>(function(){var aa=/[?&]aa=1/.test(location.search);document.documentElement.setAttribute("data-theme", aa ? "resident-aa" : "resident");if(window.HomeERP) HomeERP.paint();})();</script></body>
</html>
